<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script>
        // 管理ページから開いたとき(URLに ?name=ユーザA が付いている)はタイトルを「ユーザ名 | Wallet」にする
        const user_name = new URLSearchParams(location.search).get('name')
        if (user_name) {
            document.title = `${user_name} | Wallet`
        }

        $(function () {
            // どのウォレット(8080/8081など)を開いているか分かるように表示
            $('#node_host').text(user_name ? `${user_name} / ${location.host}` : location.host)

            $.ajax({
                url: '/wallet',
                type: 'POST',
                success: function (response) {
                    $('#public_key').val(response['public_key'])
                    $('#private_key').val(response['private_key'])
                    $('#blockchain_address').val(response['blockchain_address'])
                    console.info(response)
                },
                error: function (error) {
                    console.error(error)
                }
            })

            $('#send_money_button').click(function () {
                let confirm_text = 'Are you sure to send?'
                let confirm_result = confirm(confirm_text)
                if (confirm_result !== true) {
                    alert('Canceled')
                    return
                }

                let transaction_data = {
                    'sender_private_key': $('#private_key').val(),
                    'sender_blockchain_address': $('#blockchain_address').val(),
                    'recipient_blockchain_address': $('#recipient_blockchain_address').val(),
                    'sender_public_key': $('#public_key').val(),
                    'value': $('#send_amount').val(),
                }

                $.ajax({
                    url: '/wallet/transaction',
                    type: 'POST',
                    contentType: 'application/json',
                    dataType: 'json',
                    data: JSON.stringify(transaction_data),
                    success: function (response) {
                        alert('Send success')
                    },
                    error: function (error) {
                        console.error(error)
                        alert('Send failed')
                    }
                })
            })
        })
    </script>
</head>

<body>
    <header class="topbar">
        <div class="brand">Python<span>/</span>Blockchain</div>
        <div class="status" id="node_host"></div>
    </header>

    <main class="layout">
        <section class="section">
            <div class="section-head">
                <span class="section-no">01</span>
                <h1>Wallet</h1>
            </div>
            <div class="balance">
                <div>
                    <div class="balance-label">Balance</div>
                    <div id="wallet_amount">0</div>
                </div>
                <button id="reload_wallet">Reload Wallet</button>
            </div>

            <div class="field">
                <label for="public_key">Public Key</label>
                <textarea id="public_key" rows="2"></textarea>
            </div>
            <div class="field field-secret">
                <label for="private_key">Private Key <small>他人に見せないこと</small></label>
                <textarea id="private_key" rows="1"></textarea>
            </div>
            <div class="field">
                <label for="blockchain_address">Blockchain Address</label>
                <textarea id="blockchain_address" rows="1"></textarea>
            </div>
        </section>

        <section class="section">
            <div class="section-head">
                <span class="section-no">02</span>
                <h1>Send Money</h1>
            </div>
            <div class="field">
                <label for="recipient_blockchain_address">Address <small>送金先</small></label>
                <input type="text" id="recipient_blockchain_address" placeholder="送金先のアドレスを貼り付け">
            </div>
            <div class="field">
                <label for="send_amount">Amount <small>金額</small></label>
                <input type="text" id="send_amount" placeholder="0.0">
            </div>
            <button id="send_money_button">Send</button>
        </section>
    </main>
</body>

</html>
